name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: --bundles nsis
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # No Apple notarization and no Authenticode (macOS is ad-hoc signed).
      # Update payloads are signed with the updater key; its public half is in
      # tauri.conf.json.
      - run: npx tauri build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: cloudborne-${{ runner.os }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/release/bundle/nsis/*.exe*
          if-no-files-found: error

  # A v* tag produces a draft release with the installers, the update payloads
  # and latest.json. Publishing the draft (not prerelease, marked latest) is
  # what pushes the update to installed clients.
  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # checkout leaves a bare commit; fetch the annotated tag for its message.
      - run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - name: Check version matches tag
        run: |
          v=$(jq -r .version src-tauri/tauri.conf.json)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tauri.conf.json is $v, tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Write latest.json
        run: |
          # Artifacts keep their target/ subpaths; flatten them.
          find out -mindepth 2 -type f -exec mv {} out/ \;
          cd out && ls -la
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          mac=$(ls *.app.tar.gz); win=$(ls *-setup.exe)
          notes=$(git -C .. tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          jq -n --arg v "${GITHUB_REF_NAME#v}" --arg notes "$notes" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac "$base/$mac" --arg macsig "$(cat "$mac.sig")" \
            --arg win "$base/$win" --arg winsig "$(cat "$win.sig")" \
            '{version:$v, notes:$notes, pub_date:$date, platforms:{
               "darwin-aarch64":{url:$mac, signature:$macsig},
               "darwin-x86_64":{url:$mac, signature:$macsig},
               "windows-x86_64":{url:$win, signature:$winsig}}}' > latest.json
          cat latest.json
          sha256sum *.dmg *.exe *.app.tar.gz > SHA256SUMS.txt
          # Fixed names so download pages can link releases/latest/download/<name>.
          cp *.dmg Cloudborne-macOS.dmg
          cp *-setup.exe Cloudborne-Windows-setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            out/*.dmg
            out/*.exe
            out/*.app.tar.gz
            out/*.sig
            out/latest.json
            out/SHA256SUMS.txt
