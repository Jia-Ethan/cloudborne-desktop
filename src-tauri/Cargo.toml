[package]
name = "cloudborne-desktop"
version = "0.9.13"
description = "Cloudborne relay desktop client"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "cloudborne_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["process", "fs", "io-util", "macros", "sync", "time", "net"] }
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
futures-util = "0.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots", "handshake"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
tempfile = "3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
winreg = "0.56"

[dev-dependencies]
tempfile = "3"
